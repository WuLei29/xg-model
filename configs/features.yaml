pitch:
  length: 105.0
  width: 68.0
  goal_x: 105.0
  goal_y_center: 34.0
  goal_post_left_y: 30.34   # smaller y value (34 - 3.66)
  goal_post_right_y: 37.66  # larger y value (34 + 3.66)
  goal_width: 7.32           # metres (37.66 - 30.34)
  central_half_width: 8.5    # metres from center; is_central = |y - 34| <= this

features:
  baseline_spatial:
    - distance_to_goal # Distancia hasta la porteria
    - visible_angle # Ángulo a la porteria
    - distance_to_near_post # Distancia al palo más cercano
    - distance_to_far_post # Distancia al palo más lejano
    - x_from_goal_line # Distancia x a la linea de gol
    - is_central # Si esta centrado

  baseline_categorical:
    - is_header
    - is_right_foot
    - is_left_foot
    - is_other_bodypart
    - is_normal_technique
    - is_volley
    - is_diving_header
    - is_exotic_technique
    - is_regular_play
    - is_from_counter # The event was part of a counter attack.
    - is_from_set_piece_restart # The event was part of the passage of play following a corner, free-kick or throw-in

  baseline_contextual:
    - is_first_time
    - is_weak_foot
    - minute

  advanced_gamestate:
    - score_diff_at_shot
    - is_late_game

feature_sets:
  baseline:
    - baseline_spatial
    - baseline_categorical
    - baseline_contextual
  full:
    - baseline_spatial
    - baseline_categorical
    - baseline_contextual
    - advanced_gamestate # We add gamestate to the model

# Columns kept in the design matrix for metadata / subgroup analysis but never model inputs.
metadata_cols:
  - shot_id
  - match_id
  - match_key
  - competition_id
  - season_id
  - player_id
  - team_id
  - period
  - second
  - location_x
  - location_y
  - shot_outcome
  - shot_body_part
  - shot_technique
  - shot_type
  - play_pattern

target_cols:
  - is_goal
  - statsbomb_xg
