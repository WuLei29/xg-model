xgboost:
  objective: binary:logistic
  eval_metric: logloss

  # Tree structure
  max_depth: 4              # conservative depth — enough for 2-way interactions
  min_child_weight: 15      # minimum sum of weights in a leaf; stabilises rare events

  # Shrinkage & subsampling (stochastic regularisation)
  learning_rate: 0.05       # small eta → more trees needed, better generalisation
  subsample: 0.80           # row subsampling per tree (bagging-like)
  colsample_bytree: 0.80    # feature subsampling per tree

  # L1 / L2 weight regularisation on leaf values
  reg_alpha: 0.0
  reg_lambda: 1.0

  # Split-gain pruning (0 = no pruning, positive = harder to split)
  gamma: 0.0

  # Training budget — early stopping finds the actual best count
  n_estimators: 2000
  early_stopping_rounds: 50

  # Class imbalance: keep at 1 to preserve calibrated probabilities.
  # Reweighting improves recall but distorts probability estimates.
  scale_pos_weight: 1

  random_state: 42
  n_jobs: -1
  verbosity: 0
